services:
  master:
    build:
      context: ./master
      dockerfile: Dockerfile
    container_name: master
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # Lets the container resolve "host.docker.internal" to the host's
    # gateway IP on Linux (Docker Desktop already does this on Mac/Windows).
    # Needed so DATABASE_URL can point at a Postgres running natively on
    # the host for local dev — see .env.local.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  connector:
    build:
      context: ./connector
      dockerfile: Dockerfile
    container_name: connector
    env_file:
      - connector/.env
    environment:
      MASTER_API_URL: http://master:8000
